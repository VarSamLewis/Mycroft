[project]
name = "mycroft"
version = "0.1.0"
description = "Interactive data lineage explorer"
requires-python = ">=3.10"
dependencies = [
    "sqlglot",
    "graphviz",
    "neo4j",
    "pygithub",
    "typing_extensions",
    "py-spy",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
    "pydantic",
]
cli = [
    "textual",
]

[project.scripts]
mycroft = "mycroft.cli.cli:main"
mycroft-api = "mycroft.consum_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycroft"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
files = ["src/mycroft"]
show_error_codes = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
